#
# 从 tag 推送触发的 Build 运行中下载制品并发布。
# 发布失败时重跑原 Build（Re-run all jobs），以保留对应的 run-id 与 push 事件。

name: Release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  # contents: write 用于建 Release 与上传附件;
  # actions: read 用于按 run-id 跨工作流下载 Build 的制品,缺了会 403。
  contents: write
  actions: read

jobs:
  release:
    name: 发布
    runs-on: ubuntu-latest
    # Build 必须成功,且是被 v* tag 推送触发的。
    # head_branch 是分支名,在 tag 事件下等于 tag 名;加 event 判断是因为
    # 手动触发的 Build 同样有 head_branch,单看它会把普通分支构建当发布。
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # 校验 tag 要读 refs/tags,浅克隆不取对象库外的 ref。
          fetch-depth: 0

      - name: 校验 tag
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # gh release create 在 tag 不存在时会自行创建,拿分支名当 tag 用
          # 就会发出一个指向未知提交的版本。这里要求 tag 已存在且指向本次构建的提交。
          if ! found=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            echo "::error::tag $TAG 不存在,拒绝发布"
            exit 1
          fi
          # ^{commit} 会把附注/签名标签逐层剥离到提交:git/ref/tags 接口的
          # .object.sha 对这类标签返回的是标签对象自身的 SHA,不比配就会误判。
          if [ "$found" != "$(git rev-parse HEAD)" ]; then
            echo "::error::tag $TAG 指向 $found,与本次构建的提交不一致"
            exit 1
          fi
          echo ">> tag $TAG 校验通过:$found"

      - uses: actions/download-artifact@v4
        with:
          # 只取发布制品。不加 pattern 会把前端 job 的 web-dist 一起拉下来,
          # 压平后 HTML/JS/CSS 会混进 Release 附件与 SHA256SUMS。
          pattern: sniffy-*
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 整理制品目录
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          # 下载后是 artifacts/<artifact-name>/<file> 两层;压平到 release/ 并加回可执行位。
          find artifacts -type f -exec cp {} release/ \;
          chmod +x release/sniffy-* || true
          ls -la release/

      - name: 生成校验和
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # 制品与 tag 均已在前面校验过,这里只做发布。同名 tag 已存在 Release 时覆盖附件。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "$TAG" \
              --generate-notes
          fi

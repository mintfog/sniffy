# 校验 Go、跨平台编译及前端；制品打包见 build.yml。

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 前端构建偶发 OOM。
  NODE_OPTIONS: "--max-old-space-size=4096"
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # -race 需要 CGO，使用 runner 自带的 C 编译器。
      - name: Go 测试
        run: go test -race -count=1 ./...

      - name: 更新功能覆盖率
        run: go test -count=1 -coverpkg=./internal/update,./internal/service,./internal/api,./internal/app,./internal/platform -covermode=atomic -coverprofile=coverage.out ./internal/update ./internal/service ./internal/api ./internal/app ./internal/platform

      - name: 更新功能覆盖率门槛
        run: |
          python -X utf8 scripts/tests/check-update-coverage.test.py
          python -X utf8 scripts/check-update-coverage.py coverage.out

      - name: 桌面测试
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: go test -race -count=1 -tags desktop -coverprofile=coverage-desktop.out ./internal/desktop ./internal/update ./internal/service

      - name: 保存 Go 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-go-${{ runner.os }}
          path: coverage*.out
          if-no-files-found: error

      - name: 安装 Linux webview 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # 使用仓库占位资源校验桌面入口；发布构建嵌入实际前端产物。
      - name: 桌面生产编译
        if: runner.os != 'Windows'
        shell: bash
        run: go build -tags desktop,production -trimpath -o "$RUNNER_TEMP/sniffy-desktop" ./cmd/sniffy-desktop

  go-cross:
    name: Go 交叉编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: headless 交叉编译
        run: |
          bash scripts/build.sh headless \
            linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64

      # Windows 桌面后端为纯 Go，可直接在 Linux 上交叉编译。
      - name: Windows 桌面交叉编译
        run: |
          test_dir="$(mktemp -d -t sniffy-windows-resources-XXXXXX)"
          trap 'rm -rf "$test_dir"' EXIT
          for arch in amd64 arm64; do
            bash scripts/generate-windows-resources.sh "$arch"
            binary="$test_dir/sniffy-${arch}.exe"
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build \
              -tags desktop,production -trimpath -ldflags '-H windowsgui' \
              -o "$binary" ./cmd/sniffy-desktop
            SNIFFY_WINDOWS_TEST_BINARY="$binary" SNIFFY_WINDOWS_TEST_ARCH="$arch" \
              node --test scripts/tests/windows-resources.test.mjs
          done

  frontend:
    name: 前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: 类型检查
        run: npm run type-check
      - name: lint
        run: npm run lint
      - name: 单元测试与更新功能覆盖率门槛
        run: npm run test:coverage
      - name: 保存前端覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: web/coverage/
          if-no-files-found: error
      - name: 发布与安装包流程测试
        run: |
          bash ../scripts/tests/generate-release-notes.test.sh
          bash ../scripts/tests/release-manifest.test.sh
          node --test ../scripts/tests/desktop-installer.test.mjs
          node --test ../scripts/tests/windows-resources.test.mjs
          bash ../scripts/tests/make-deb-installer.test.sh
          bash ../scripts/tests/make-dmg-installer.test.sh
      - name: 生产构建
        run: npm run build

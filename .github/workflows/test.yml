# 校验 Go、跨平台编译及前端；制品打包见 build.yml。

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 前端构建偶发 OOM。
  NODE_OPTIONS: "--max-old-space-size=4096"
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # -race 需要 CGO，使用 runner 自带的 C 编译器。
      - name: Go 测试
        run: go test -race -count=1 ./...

      - name: 桌面测试
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: go test -race -count=1 -tags desktop ./internal/desktop

      - name: 安装 Linux webview 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # 使用仓库占位资源校验桌面入口；发布构建嵌入实际前端产物。
      - name: 桌面生产编译
        if: runner.os != 'Windows'
        shell: bash
        run: go build -tags desktop,production -trimpath -o "$RUNNER_TEMP/sniffy-desktop" ./cmd/sniffy-desktop

  go-cross:
    name: Go 交叉编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: headless 交叉编译
        run: |
          bash scripts/build.sh headless \
            linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64

      # Windows 桌面后端为纯 Go，可直接在 Linux 上交叉编译。
      - name: Windows 桌面交叉编译
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags desktop -trimpath -o /dev/null ./cmd/sniffy-desktop

  frontend:
    name: 前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: 类型检查
        run: npm run type-check
      - name: lint
        run: npm run lint
      - name: 单元测试
        run: npm test
      - name: 生产构建
        run: npm run build

# tag 与手动构建生成 headless、桌面程序及 Windows 安装包。

name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  GOTOOLCHAIN: local
  # 版本号:tag 构建取 tag 名,否则用提交 SHA。两端用同一表达式,避免对不上。
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
  LDFLAGS: >-
    -s -w
    -X github.com/mintfog/sniffy/internal/version.Version=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}

jobs:
  # 前端构建一次,供所有桌面 job 复用。web/dist 已在 .gitignore 中,
  # 桌面入口的 //go:embed all:dist 依赖它存在,故必须先构建。
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # headless:纯 Go,CGO_ENABLED=0,一次跑完全部平台。
  headless:
    name: headless ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="sniffy-${GOOS}-${GOARCH}${ext}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "$LDFLAGS" \
            -o "dist/$out" ./cmd/sniffy
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: 校验可执行文件版本
        shell: bash
        # Windows/arm64 等产物无法在此运行,只对当前 runner 可执行的做冒烟测试。
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./dist/sniffy-linux-amd64 -version

      - uses: actions/upload-artifact@v4
        with:
          name: sniffy-headless-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  # 桌面:各平台必须原生构建(Linux 需 webkit 的 CGO,macOS 需系统 WKWebView)。
  desktop:
    name: desktop ${{ matrix.name }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # production 禁用 Wails 的开发服务器接管和默认调试功能。
          # Linux 使用 GTK4 + webkitgtk-6.0。
          - { name: linux/amd64,   os: ubuntu-latest,       goos: linux,  goarch: amd64, tags: 'desktop,production' }
          - { name: windows/amd64, os: windows-latest,      goos: windows, goarch: amd64, tags: 'desktop,production' }
          # CGO 构建使用与目标架构一致的 macOS runner。
          - { name: darwin/amd64,  os: macos-15-intel,      goos: darwin, goarch: amd64, tags: 'desktop,production' }
          - { name: darwin/arm64,  os: macos-latest,        goos: darwin, goarch: arm64, tags: 'desktop,production' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: 准备桌面 embed 资源
        shell: bash
        run: |
          rm -rf cmd/sniffy-desktop/dist
          mkdir -p cmd/sniffy-desktop/dist
          cp -r web/dist/* cmd/sniffy-desktop/dist/

      - name: 安装 Linux webview 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # Windows 后端是纯 Go(go-webview2),关掉 CGO 可避免 MSYS2 / mingw 干扰。
      - name: 编译
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAGS: ${{ matrix.tags }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          cgo=1
          extra=""
          if [ "$GOOS" = "windows" ]; then cgo=0; extra="-H windowsgui"; fi
          out="sniffy-desktop-${GOOS}-${GOARCH}"
          CGO_ENABLED=$cgo go build -tags "$TAGS" -trimpath \
            -ldflags "$LDFLAGS $extra" \
            -o "dist/${out}${ext}" ./cmd/sniffy-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: sniffy-desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  # Windows 安装包。依赖上面产出的 exe,单独一个 job 以免拖慢其他平台。
  windows-installer:
    name: Windows 安装包
    needs: desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sniffy-desktop-windows-amd64
          path: dist

      - name: 安装 NSIS
        # Windows runner 自带 makensis;缺失时回退到 choco。
        shell: bash
        run: makensis -VERSION || choco install nsis -y

      # 直接给已构建好的 exe 打安装包,不重新编译——Release 里的安装包
      # 与上面矩阵产出的二进制是同一份。
      - name: 生成安装包
        shell: bash
        run: |
          bash scripts/make-nsis-installer.sh \
            --binary "dist/sniffy-desktop-windows-amd64.exe" \
            --version "${VERSION#v}" \
            --out "dist/sniffy-desktop-windows-amd64-installer.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: sniffy-windows-installer
          path: dist/*installer.exe
          retention-days: 7

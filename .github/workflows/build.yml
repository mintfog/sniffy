#
# 构建 headless、桌面程序及三平台安装包，tag 推送在校验与构建成功后发布 Release。

name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  # 传入 VERSION 会让 build.sh 裁剪符号表；tag 构建取 tag 名，否则用提交 SHA。
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}

jobs:
  checks:
    name: 发布前校验
    uses: ./.github/workflows/test.yml

  # 各桌面目标复用同一份前端产物。
  frontend:
    name: 前端构建
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # headless 为纯 Go，可在同一 runner 上完成所有目标的交叉编译。
  headless:
    name: headless
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译
        run: |
          bash scripts/build.sh headless \
            linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64

      - name: 校验版本
        run: |
          actual="$(./dist/sniffy-linux-amd64 -version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::版本号不匹配：实际 $actual，期望 $VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: sniffy-headless
          path: dist/*
          retention-days: 7

  # Linux 与 macOS 桌面依赖系统 WebView，使用原生 runner 构建。
  desktop:
    name: desktop ${{ matrix.name }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux/amd64,   os: ubuntu-latest,       goos: linux,   goarch: amd64, installer_ext: deb }
          - { name: windows/amd64, os: windows-latest,      goos: windows, goarch: amd64, installer_ext: exe }
          # CGO 构建使用与目标架构一致的 macOS runner。
          - { name: darwin/amd64,  os: macos-15-intel,      goos: darwin,  goarch: amd64, installer_ext: dmg }
          - { name: darwin/arm64,  os: macos-latest,        goos: darwin,  goarch: arm64, installer_ext: dmg }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: 安装 Linux webview 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev dpkg-dev binutils imagemagick

      # 生产入口从 cmd/sniffy-desktop/dist 嵌入前端资源。
      - name: 准备桌面资源
        shell: bash
        run: |
          rm -rf cmd/sniffy-desktop/dist
          mkdir -p cmd/sniffy-desktop/dist
          cp -r web/dist/* cmd/sniffy-desktop/dist/

      # Windows 使用纯 Go 后端；Linux 与 macOS 通过 CGO 调用系统 WebView。
      # production 禁用 Wails 的开发服务器接管和默认调试功能。
      - name: 编译
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="dist/sniffy-desktop-${GOOS}-${GOARCH}"
          cgo=1
          ldflags="-s -w -X github.com/mintfog/sniffy/internal/version.Version=${VERSION}"
          if [ "$GOOS" = "windows" ]; then
            out="${out}.exe"
            cgo=0
            ldflags="$ldflags -H windowsgui"
          fi
          if [ "$GOOS" = "darwin" ]; then
            export MACOSX_DEPLOYMENT_TARGET=12.0
            export CGO_CFLAGS="${CGO_CFLAGS:-} -mmacosx-version-min=12.0"
            export CGO_LDFLAGS="${CGO_LDFLAGS:-} -mmacosx-version-min=12.0"
          fi
          CGO_ENABLED="$cgo" go build -tags desktop,production -trimpath \
            -ldflags "$ldflags" \
            -o "$out" ./cmd/sniffy-desktop

      - uses: actions/upload-artifact@v7
        with:
          name: sniffy-desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: 安装 NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $makensis = Join-Path $nsisDir 'makensis.exe'
          & $makensis -VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $nsisDir -Encoding utf8

      - name: 验证 NSIS 安装包
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/tests/make-nsis-installer.test.sh

      - name: 安装 DMG 打包工具
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/sniffy-dmg-tools"
          "$RUNNER_TEMP/sniffy-dmg-tools/bin/python" -m pip install -r build/darwin/dmg-requirements.txt
          echo "$RUNNER_TEMP/sniffy-dmg-tools/bin" >> "$GITHUB_PATH"

      - name: 生成安装包
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          INSTALLER_EXT: ${{ matrix.installer_ext }}
        run: |
          binary="dist/sniffy-desktop-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            binary="${binary}.exe"
          fi
          bash scripts/make-desktop-installer.sh \
            --os "$GOOS" --arch "$GOARCH" \
            --binary "$binary" \
            --version "${VERSION#v}" \
            --out "dist/installers/sniffy-desktop-${GOOS}-${GOARCH}-installer.${INSTALLER_EXT}"

      - uses: actions/upload-artifact@v7
        with:
          name: sniffy-desktop-${{ matrix.goos }}-${{ matrix.goarch }}-installer
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布
    needs: [headless, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          # web-dist 只是桌面打包的中间产物，发布附件使用 sniffy-*。
          pattern: sniffy-*
          path: release
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber -R "$GITHUB_REPOSITORY"
          else
            bash scripts/generate-release-notes.sh "$TAG" "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" release/* \
              --title "Sniffy ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              -R "$GITHUB_REPOSITORY"
          fi
